<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/" />
    <title>Admin Login | Excel Event Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
    <link rel="stylesheet" href="../css/components.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container navbar">
        <div class="brand">
          <div class="brand-mark">E</div>
          <div>
            <p class="brand-text" data-college-name>Excel Engineering College</p>
            <p class="brand-subtext">Event Hub</p>
          </div>
        </div>
        <nav class="main-nav" aria-label="Main navigation">
          <a href="../index.html">Home</a>
          <a href="events.html">Events</a>
          <a href="admin-login.html">Admin</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="page-hero">
        <div class="container page-header">
          <span class="tag">Admin Access</span>
          <h1>Secure staff login</h1>
        </div>
      </section>

      <section class="section">
        <div class="container" style="max-width: 560px;">
          <div class="form-card">
            <form id="admin-login-form" novalidate>
              <div class="form-field">
                <label for="admin-identity">Admin Email / Username</label>
                <input id="admin-identity" name="identity" type="text" placeholder="admin@college.edu or username" autocomplete="username" />
                <div class="error-message" id="identity-error" aria-live="polite"></div>
              </div>

              <div class="form-field">
                <label for="admin-password">Password</label>
                <input id="admin-password" name="password" type="password" placeholder="Enter secure password" autocomplete="current-password" />
                <div style="display:flex;align-items:center;gap:0.6rem;margin-top:0.45rem;">
                  <label class="checkbox-inline" style="gap:0.4rem;">
                    <input type="checkbox" id="toggle-password" /> Show password
                  </label>
                </div>
                <div class="error-message" id="password-error" aria-live="polite"></div>
              </div>

              <div class="form-actions">
                <button type="submit" class="btn btn--primary">Login</button>
              </div>

              <div id="login-message" style="display:none" aria-live="polite"></div>
            </form>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-wrap">
        <p>© 2026 Excel Event Hub</p>
        <p data-college-location>Komarapalayam, Namakkal, Tamil Nadu, India</p>
      </div>
    </footer>

    <script src="../data/college.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/mouse-trail.js"></script>
    <script src="../js/admin-login.js"></script>
  </body>
</html>
